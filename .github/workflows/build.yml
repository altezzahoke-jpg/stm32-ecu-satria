name: Compile STM32F4 ECU Firmware

on:
  push:
    branches: [ main, master ]
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Setup Arduino CLI
        uses: arduino/setup-arduino-cli@v2

      - name: Install STMicroelectronics STM32 Core
        run: |
          arduino-cli core update-index --additional-urls https://github.com/stm32duino/BoardManagerFiles/raw/master/package_stmicroelectronics_index.json
          arduino-cli core install STMicroelectronics:stm32 --additional-urls https://github.com/stm32duino/BoardManagerFiles/raw/master/package_stmicroelectronics_index.json

      - name: Compile Sketch (.bin)
        run: |
          mkdir -p build_output
          arduino-cli compile --fqbn STMicroelectronics:stm32:GenF4:pnum=BLACKPILL_F411CE --output-dir build_output .

      - name: Upload Firmware Artifact
        uses: actions/upload-artifact@v4
        with:
          name: STM32F4-ECU-SatriaFU
          path: build_output/*.bin
